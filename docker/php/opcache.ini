[opcache]
opcache.enable=1
opcache.enable_cli=1
; 0 means it will check on every request
; 0 is irrelevant if opcache.validate_timestamps=0 which is desirable in production
opcache.revalidate_freq=0
opcache.validate_timestamps=1
opcache.max_accelerated_files=10000
opcache.memory_consumption=128
opcache.max_wasted_percentage=10
opcache.interned_strings_buffer=16
; Refer to https://www.php.net/manual/en/opcache.configuration.php for more information
; See also https://laravel-news.com/php-opcache-docker
; See also https://blog.blackfire.io/boosting-php-performance-mastering-opcache-optimization-with-blackfire.html?utm_source=devto&utm_medium=organic_social&utm_campaign=blog-post
