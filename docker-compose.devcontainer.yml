name: braidphp-devcontainer
services:
    php:
        container_name: braidphp-devcontainer-${ENVIRONMENT}
        image: localhost/dvictorjhg/braidphp-devcontainer:${DOCKER_IMAGE_TAG}
        build:
            context: .
            dockerfile: docker/php/php.devcontainer.Dockerfile
        env_file: .env
        init: true
        working_dir: ${APP_PATH}
        command: ["sh", "-c", "trap 'exit 0' TERM INT; while true; do sleep 3600; done"]
        ports:
            - ${SERVER_PORT}:${SERVER_PORT}
        volumes:
            - ./:${APP_PATH}
            - ./debug:/tmp/xdebug
